<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slipshow LSP demo</title>
    <style>
      body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
      #editor { width: 50%; overflow: auto; border-right: 1px solid #ccc; }
      #editor .cm-editor { height: 100%; }
      #right { width: 50%; display: flex; flex-direction: column; }
      #preview { flex-grow: 1; position: relative; }
      #errors { max-height: 30%; overflow: auto; margin: 0; }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <div id="right">
      <div id="preview"></div>
      <pre id="errors"></pre>
    </div>
    <script src="example.bc.js"></script>
  </body>
</html>
