name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  linux-build:
    strategy:
      matrix:
        platform:
          - { name: "linux/amd64", filename_suffix: "linux-amd64", target_arch: "x86_64", runner: "ubuntu-22.04" }
          - { name: "linux/arm64", filename_suffix: "linux-arm64", target_arch: "arm64", runner: "ubuntu-22.04-arm" }
        runAllTests:
          - ${{ startsWith(github.ref, 'refs/tags/') }}
        # exclude:
        #   - platform: { name: "linux/arm64", filename_suffix: "linux-arm64", target_arch: "arm64"  }
        #     runAllTests: false
      fail-fast: false
    runs-on: ${{ matrix.platform.runner }}

    env:
      SLIPSHOW_PLATFORM: ${{ matrix.platform.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true # Needed to fetch tags

      # The latest tag is needed to build the release tarball but
      # actions/checkout fails to fetch it properly.
      # https://github.com/actions/checkout/issues/882
      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        # with:
        #   driver: docker

      - name: Check images
        run: docker image ls

      - name: Install dependencies in Docker
        run: |
          docker buildx build --platform ${{ matrix.platform.name }} \
            --target deps \
            --cache-to type=gha,mode=max,scope=${{ matrix.platform.filename_suffix }}-deps \
            --cache-from type=gha,scope=${{ matrix.platform.filename_suffix }}-deps \
            -f release/Dockerfile .

      - name: Build release tarball
        # if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p new_release; chmod a+rw new_release;
          docker buildx build --platform ${{ matrix.platform.name }} \
            --cache-from type=gha,scope=${{ matrix.platform.filename_suffix }}-deps \
            --build-arg VERSION=$GITHUB_REF_NAME \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=${{ matrix.platform.target_arch }} \
            -f release/Dockerfile \
            --output type=local,dest=new_release .

      - name: upload archives
        # if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: archives-linux-${{ matrix.platform.target_arch }}
          path: new_release/*

  mac-build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: "macos-15-intel", arch: "x86_64" }
          - { os: "macos-14", arch: "arm64" }
        ocaml-compiler:
          - 4.14.x
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      # See the same step in the linux build
      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # - uses: actions/cache@v5
      #   id: cache
      #   with:
      #     path: |
      #       ~/.opam
      #       _opam
      #     key: ${{ matrix.config.os }}-${{ hashFiles('*.opam') }}-${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        # if: steps.cache.outputs.cache-hit != 'true'
        run: opam install --deps-only --with-test --with-doc -y .

      # - name: Install dependencies
      #   if: steps.cache.outputs.cache-hit
      #   run: opam install --deps-only --with-test --depext-only --with-doc -y . && opam upgrade

      - name: Build release tarball
        # if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p new_release;
          export OUTPUT=$PWD/new_release;
          export TARGETOS=macos;
          export TARGETARCH=${{ matrix.config.arch }};
          export VERSION=$GITHUB_REF_NAME;
          # Delete Homebrew's .dylib files so the link picks up the static
          # archives instead, like in semgrep before they switched to noautolink
          # and listing all dependencies. Destructive, hence only on a
          # throw-away CI runner. See
          # src/cli/static-linking-flags/static_linking_flags.ml.
          export SLIPSHOW_DELETE_HOMEBREW_DYLIBS=1;
          opam exec -- bash release/release.sh

      - name: upload archives
        # if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.config.os }}-${{ matrix.config.arch }}
          path: new_release/*

  windows-build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "windows", os: "windows-2022", arch: "x86_64", target: "x64" }
        ocaml-compiler:
          - 4.14.x
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Install OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install something that triggers mingw-w64-shims recompilation
        run: opam install conf-mingw-w64-gcc-i686 -y

      - name: Install dependencies
        run: opam install --deps-only --with-test --with-doc -y .

      - name: Build Windows executable
        run: |
          opam exec -- dune build --profile release -p slipshow
          mkdir -p new_release
          cp _build/install/default/bin/slipshow.exe new_release/slipshow.exe

      - name: Verify executables
        run: |
          Test-Path _build/install/default/bin/slipshow.exe
          Test-Path new_release/slipshow.exe

      - name: Create ZIP archive slipshow-${{ matrix.config.name }}-${{ matrix.config.target }}.zip
        run: Compress-Archive -Path new_release/slipshow.exe -DestinationPath new_release/slipshow-${{ matrix.config.name }}-${{ matrix.config.target }}.zip
        
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: archives-windows-${{ matrix.config.arch }}
          path: new_release/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-build, mac-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: archives
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            archives/*
