name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/screenshot-based
    steps:
    - uses: actions/checkout@v6

    - name: Use OCaml 4.14.x
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 4.14.x

    - name: Install OCaml dependencies
      working-directory: .
      run: opam install --deps-only -y .

    # Some tests use HTML files generated by dune
    - name: Build
      working-directory: .
      run: opam exec -- dune build --profile release

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium firefox

    # Tests compile .slp files with the slipshow in the PATH
    - name: Run Playwright tests
      run: opam exec -- dune exec --profile release -- npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: test/screenshot-based/playwright-report/
        retention-days: 30
