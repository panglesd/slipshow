name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/screenshot-based
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Use OCaml 4.14.x
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 4.14.x

    - name: Install OCaml dependencies
      working-directory: .
      run: opam install --deps-only -y .

    - name: Generate the HTML files
      working-directory: .
      run: opam exec -- dune build --profile release

    # In Playwright's Docker image, so that the rendering is the same as when
    # the screenshots were generated
    - name: Run Playwright tests
      run: opam exec -- ./playwright-docker.sh

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: test/screenshot-based/playwright-report/
        retention-days: 30
