name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/screenshot-based
    steps:
    - uses: actions/checkout@v6

    - name: Use OCaml 4.14.x
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 4.14.x

    - name: Install OCaml dependencies
      working-directory: .
      run: opam install --deps-only -y .

    - name: Generate the HTML files
      working-directory: .
      run: opam exec -- dune build --profile release

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium firefox

    # Temporary: to compare the font rendering with a local machine
    - name: Font rendering info
      continue-on-error: true
      run: |
        dpkg-query -W libfreetype6 libfontconfig1 libcairo2 libharfbuzz0b || true
        echo "FREETYPE_PROPERTIES=$FREETYPE_PROPERTIES"
        fc-match -v sans-serif | grep -E 'antialias|hint|rgba|lcdfilter' || true
        fc-conflist | grep '^+' || true
        ldd ~/.cache/ms-playwright/firefox-*/firefox/libxul.so | grep -E 'freetype|fontconfig|cairo|harfbuzz' || true

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: test/screenshot-based/playwright-report/
        retention-days: 30
